<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Fish shortlist: aquarium fish, South Australia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Public+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="fish.js" defer></script>
    <script src="core.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <h1 class="visually-hidden">Fish shortlist</h1>

    <div class="toolbar">
      <div class="page-width">
        <div class="toolbar__row">
          <label class="visually-hidden" for="q">Search by name</label>
          <input
            id="q"
            class="search"
            type="search"
            placeholder="Search fish"
            autocomplete="off"
          />
          <button
            type="button"
            class="facet-button"
            id="open-filters"
            aria-label="Filter"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7h16M7 12h10M10 17h4" />
            </svg>
            <span class="facet-button__count" id="filter-count" hidden></span>
          </button>
          <label class="sort" id="sort-control">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 4v16M4 8l4-4 4 4M16 20V4M12 16l4 4 4-4" />
            </svg>
            <span class="visually-hidden">Sort by</span>
            <select id="sort">
              <option value="featured">Featured</option>
              <option value="name-asc">Name, A to Z</option>
              <option value="name-desc">Name, Z to A</option>
              <option value="diff-asc">Difficulty, easiest first</option>
              <option value="diff-desc">Difficulty, hardest first</option>
              <option value="price-asc">Price, low to high</option>
              <option value="price-desc">Price, high to low</option>
            </select>
          </label>
          <a class="cart-button" href="list.html">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9 6h11M9 12h11M9 18h11" />
              <path d="M4 6h.01M4 12h.01M4 18h.01" />
            </svg>
            <span class="visually-hidden">View your list,</span>
            <span class="cart-button__count" data-cart-count>0</span>
            <span class="visually-hidden">items,</span>
            <span class="cart-button__total" data-cart-total>$0.00</span>
          </a>
        </div>
        <div class="toolbar__meta">
          <p class="result-count" id="result-count" aria-live="polite"></p>
          <ul class="active-facets" id="active-facets" hidden></ul>
        </div>
        <nav class="groups" id="groups" aria-label="Jump to a group"></nav>
      </div>
    </div>

    <main class="page-width catalogue" id="list">
      <noscript>
        <p class="notice">This page needs JavaScript to show the fish list.</p>
      </noscript>
      <div id="group-sections"></div>
      <div class="empty" id="empty" hidden>
        <h2>No fish match</h2>
        <p>Try a different name, or clear the search and filters.</p>
        <button type="button" class="button button--secondary" id="clear-all">
          Clear search and filters
        </button>
      </div>
    </main>




    <dialog
      class="product-modal"
      id="fish-dialog"
      tabindex="-1"
      aria-labelledby="fish-dialog-title"
    >
      <div class="product-modal__panel">
        <div class="product-modal__bar">
          <button
            type="button"
            class="icon-button"
            data-step="-1"
            aria-label="Previous fish"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m14 6-6 6 6 6" />
            </svg>
          </button>
          <span class="product-modal__position" id="fish-position"></span>
          <button
            type="button"
            class="icon-button"
            data-step="1"
            aria-label="Next fish"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m10 6 6 6-6 6" />
            </svg>
          </button>
          <button
            type="button"
            class="icon-button product-modal__close"
            data-close
            aria-label="Close fish details"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 6l12 12M18 6 6 18" />
            </svg>
          </button>
        </div>
        <div class="product-modal__track">
          <div class="product product-modal__peek" data-peek="-1" inert></div>
          <div class="product" id="fish-dialog-body"></div>
          <div class="product product-modal__peek" data-peek="1" inert></div>
        </div>
      </div>
    </dialog>

    <dialog class="lightbox" id="lightbox" tabindex="-1" aria-label="Photo viewer">
      <div class="lightbox__panel">
        <button
          type="button"
          class="icon-button lightbox__close"
          data-close
          aria-label="Close photo viewer"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 6l12 12M18 6 6 18" />
          </svg>
        </button>
        <figure class="lightbox__figure">
          <div class="lightbox__frame"></div>
          <figcaption class="lightbox__caption"></figcaption>
        </figure>
        <div class="lightbox__nav">
          <button
            type="button"
            class="icon-button"
            data-photo-step="-1"
            aria-label="Previous photo"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m14 6-6 6 6 6" />
            </svg>
          </button>
          <span class="lightbox__counter" aria-live="polite"></span>
          <button
            type="button"
            class="icon-button"
            data-photo-step="1"
            aria-label="Next photo"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m10 6 6 6-6 6" />
            </svg>
          </button>
        </div>
      </div>
    </dialog>

    <dialog
      class="drawer drawer--left"
      id="filters"
      tabindex="-1"
      aria-labelledby="filters-title"
    >
      <div class="drawer__panel">
        <div class="drawer__head">
          <h2 id="filters-title">Filter</h2>
          <button
            type="button"
            class="icon-button"
            data-close
            aria-label="Close filters"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 6l12 12M18 6 6 18" />
            </svg>
          </button>
        </div>
        <form class="drawer__body facets" id="filter-form"></form>
        <div class="drawer__foot drawer__foot--split">
          <button
            type="button"
            class="button button--secondary"
            id="filters-clear"
          >
            Clear all
          </button>
          <button type="button" class="button" id="filters-apply" data-close>
            Show fish
          </button>
        </div>
      </div>
    </dialog>

    <div class="added" id="added" popover role="region" aria-labelledby="added-title">
      <div class="added__panel">
        <div class="added__head">
          <p class="added__title" id="added-title" role="status">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m5 12 5 5 9-10" />
            </svg>
            <span id="added-title-text">Added to your list</span>
          </p>
          <button
            type="button"
            class="icon-button"
            popovertarget="added"
            popovertargetaction="hide"
            aria-label="Close"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 6l12 12M18 6 6 18" />
            </svg>
          </button>
        </div>
        <a class="button added__view" href="list.html">
          <span>View list (<span data-cart-count>0</span>)</span>
        </a>
      </div>
    </div>
  </body>
</html>
